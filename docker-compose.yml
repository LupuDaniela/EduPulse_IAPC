name: therapypulse

services:

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-therapypulse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  eureka-server:
    build:
      context: .
      args:
        MODULE: eureka-server
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ingest-static:
    build:
      context: .
      args:
        MODULE: ingest-static
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:postgresql://pgvector:5432/${POSTGRES_DB:-therapypulse}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      OLLAMA_BASE_URL: http://ollama:11434
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      APP_CHUNK_SIZE: ${APP_CHUNK_SIZE:-800}
      APP_CHUNK_OVERLAP: ${APP_CHUNK_OVERLAP:-100}
      APP_RESOURCES_DIR: /resources
    volumes:
      - ./resources:/resources:ro
    depends_on:
      pgvector:
        condition: service_healthy
      ollama:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  ingest-dynamic:
    build:
      context: .
      args:
        MODULE: ingest-dynamic
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:postgresql://pgvector:5432/${POSTGRES_DB:-therapypulse}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      OLLAMA_BASE_URL: http://ollama:11434
      VENDOR_WEBHOOK_SECRET: ${VENDOR_WEBHOOK_SECRET:?VENDOR_WEBHOOK_SECRET must be set in .env}
      APP_INGEST_BLOCK_PRIVATE_NETWORKS: "true"
    volumes:
      - ./resources:/resources:ro
    depends_on:
      ingest-static:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  retrieval-pre:
    build:
      context: .
      args:
        MODULE: retrieval-pre
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:postgresql://pgvector:5432/${POSTGRES_DB:-therapypulse}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ingest-static:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  retrieval-post:
    build:
      context: .
      args:
        MODULE: retrieval-post
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:postgresql://pgvector:5432/${POSTGRES_DB:-therapypulse}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ingest-static:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy

volumes:
  pgdata:
  ollama-data: